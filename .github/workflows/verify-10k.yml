name: Verify 10K Landing

on:
  push:
    branches:
      - feat/10k-nutrizen-landing
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutrizen-10k-preview
          path: dist
          if-no-files-found: error
